    <script>
      // Google Analytics 4 — só roda no domínio de produção (nunca em
      // localhost/preview) e só depois de consentimento (LGPD): fica
      // definido aqui como função, mas só é chamado por CookieBanner.jsx
      // quando o visitante aceita (ou já tinha aceitado antes). App.jsx
      // dispara o page_view manualmente a cada troca de rota, já que o
      // site é uma SPA com hash routing.
      window.iniciarAnalytics = function () {
        if (location.hostname !== "gimenesepires.com.br" || window.__gaIniciado) return;
        window.__gaIniciado = true;
        var gaScript = document.createElement("script");
        gaScript.async = true;
        gaScript.src = "https://www.googletagmanager.com/gtag/js?id=G-5N2GLDRFHW";
        document.head.appendChild(gaScript);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () {
          window.dataLayer.push(arguments);
        };
        window.gtag("js", new Date());
        window.gtag("config", "G-5N2GLDRFHW", { send_page_view: false });
      };
      try {
        if (localStorage.getItem("cookie-consent") === "aceito") window.iniciarAnalytics();
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
